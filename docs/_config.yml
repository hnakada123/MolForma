# The site is generated from this folder with Jekyll and published as HTML by
# .github/workflows/pages.yml; "bundle exec jekyll build" here writes the same HTML to _site.
# The manual pages are plain Markdown without front matter, as the in-app manual shows them
# verbatim: the plugins below give them a layout, a title from their first heading and turn
# links to .md files into links to the generated pages. Keep "{{" and "{%" out of the pages.
title: MolForma
description: NWChemのための分子エディタ・計算入力作成・結果表示アプリ
description_en: A molecular editor, input builder and result viewer for NWChem
# url + baseurl begin the absolute links of the card shown where a page is shared (_includes/head.html).
url: https://hnakada123.github.io
baseurl: /MolForma
repository_url: https://github.com/hnakada123/MolForma
lang: ja

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: false
optional_front_matter:
  remove_originals: true
titles_from_headings:
  enabled: true
  strip_title: false

# Setting exclude replaces Jekyll's defaults, so the Gemfile and the gems that bundle installs
# in vendor/ (as the workflow does) are named again here.
exclude:
  - manual.qrc
  - Gemfile
  - Gemfile.lock
  - vendor
