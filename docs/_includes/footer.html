<footer class="site">
  <div class="bar">
    <span class="brand small"><img src="{{ root }}assets/molforma.svg" alt="" width="22" height="22">MolForma</span>
    <span>GPL-2.0-or-later</span>
    <nav aria-label="{% if en %}Footer{% else %}フッター{% endif %}">
      <a href="{{ root }}{{ home }}features.html">{% if en %}Features{% else %}機能と操作{% endif %}</a>
      <a href="{{ root }}{{ home }}recipes.html">{% if en %}Recipes{% else %}題材から選ぶ実習{% endif %}</a>
      <a href="{{ root }}{{ home }}mcp.html">{% if en %}MCP server{% else %}MCPサーバー{% endif %}</a>
      <a href="{{ site.repository_url }}">GitHub</a>
      <a href="{{ site.repository_url }}/blob/main/docs/{{ page.path }}">{% if en %}Source of this page{% else %}このページの原稿{% endif %}</a>
      <a href="{{ root }}{{ other }}" hreflang="{% if en %}ja{% else %}en{% endif %}" lang="{% if en %}ja{% else %}en{% endif %}">{% if en %}日本語{% else %}English{% endif %}</a>
    </nav>
  </div>
</footer>
