<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% if page.url == home %}{{ page.title }}{% else %}{{ page.title | strip_html }} | MolForma{% endif %}</title>
<meta name="description" content="{% if en %}{{ site.description_en }}{% else %}{{ site.description }}{% endif %}">
<link rel="icon" href="{{ '/assets/molforma.svg' | relative_url }}" type="image/svg+xml">
<link rel="alternate" hreflang="{% if en %}ja{% else %}en{% endif %}" href="{{ other | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
{%- comment -%} Pages serves files with max-age=600: a new stylesheet must not meet a cached old one. {%- endcomment %}
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
