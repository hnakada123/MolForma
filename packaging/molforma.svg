  </g>
  <circle cx="128" cy="68" r="36" fill="url(#oxygen)"/>
  <circle cx="128" cy="152" r="34" fill="url(#carbon)"/>
  <circle cx="64" cy="198" r="24" fill="url(#hydrogen)"/>
  <circle cx="192" cy="198" r="24" fill="url(#hydrogen)"/>
