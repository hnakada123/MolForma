    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4f7a"/>
      <stop offset="1" stop-color="#23807f"/>
    </linearGradient>
    <radialGradient id="oxygen" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffb1a8"/>
      <stop offset="0.55" stop-color="#e0473c"/>
      <stop offset="1" stop-color="#9c1f1a"/>
    </radialGradient>
    <radialGradient id="carbon" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#9aa6b2"/>
